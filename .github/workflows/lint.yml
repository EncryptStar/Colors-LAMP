
name: Lint and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint HTML, CSS and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

  test:
    name: Run Jest unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Seed the test database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql
          mysql --user=root < tests/fixtures/login.sql

      - name: Run Jest
        run: |
          php -d output_buffering=4096 -S 127.0.0.1:8000 -t html > "$RUNNER_TEMP/php-test.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8000/index.html > /dev/null || ! npm test; then
            cat "$RUNNER_TEMP/php-test.log"
            exit 1
          fi
